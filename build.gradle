plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// src/main is the code every loader shares; src/fabric has the Fabric entry points. (src/neoforge and src/forge hold
// the NeoForge and Forge entry points, which this Fabric project doesn't build.)
sourceSets {
    main {
        java {
            srcDir 'src/fabric/java'
        }
    }
}

repositories {
    // JEI
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // only the JEI plugin (edu.chemistry.compat.jei) uses JEI, and only when JEI is installed
    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
}

java {
    // Minecraft 26.1 runs on Java 25; the mod itself is compiled for Java 21
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// One jar, like the releases: education-edition-<version>-fabric.jar. Its JEI plugin only runs when JEI is installed.
jar {
    archiveClassifier = 'fabric'
}
